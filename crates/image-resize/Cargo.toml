[package]
name = "image-resize"
version = "0.1.0"
edition = "2021"
description = "Lanczos resampling and content-aware (seam carving) resizing, in the browser via WASM."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
