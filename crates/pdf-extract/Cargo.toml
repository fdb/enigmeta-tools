[package]
name = "pdf-extract"
version = "0.1.0"
edition = "2021"
description = "Extract embedded images and fonts from a PDF, in the browser via WASM."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# default features pull in `rayon`, which can't build for wasm32 (no threads).
lopdf = { version = "0.36", default-features = false }
flate2 = "1"
png = "0.17"
# lopdf's (non-optional) crypto support pulls in getrandom 0.3, which needs an
# explicit backend on wasm32-unknown-unknown. See .cargo/config.toml for the cfg.
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
