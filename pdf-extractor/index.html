<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2b6ab1" />
    <title>PDF asset extractor · enigmeta tools</title>
    <meta name="description" content="Drop a PDF and pull out every embedded image and font. Runs in your browser." />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/site.css" />
  </head>
  <body class="app">
    <header class="bar">
      <a class="brand" href="/">
        tools<span class="dot">.</span>enigmeta<span class="dot">.</span>com<span class="crumb">/pdf-extractor</span>
      </a>
      <p class="bar-desc">Pull embedded images and fonts out of a PDF. Parsed locally in WebAssembly.</p>
      <div class="bar-end">
        <button
          class="theme-toggle"
          data-theme-toggle
          type="button"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        >
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor" />
          </svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <div class="panel">
        <section class="section">
          <h2 class="section-head"><span class="n">01</span> Source</h2>
          <label class="dropzone" id="dropzone">
            <span class="glyph" aria-hidden="true">↓</span>
            <strong>Drop a PDF here</strong>
            <span>or click to choose a file</span>
            <input type="file" id="file" accept="application/pdf,.pdf" class="visually-hidden" />
          </label>
          <div class="progress" id="progress" role="progressbar" hidden>
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </section>

        <section class="section" id="toolbar" hidden>
          <h2 class="section-head"><span class="n">02</span> Assets</h2>
          <p class="hint mono" id="summary"></p>
          <div class="btn-row">
            <button class="btn btn-primary" id="download-all" type="button">↓ All as ZIP</button>
          </div>
        </section>
      </div>

      <section class="stage" aria-label="Extracted assets">
        <div class="gallery" id="gallery"></div>
        <p class="empty-hint stage-empty">Images and fonts appear here.</p>
      </section>
    </main>

    <footer class="statusbar">
      <p class="status" id="status" data-kind="idle" role="status" aria-live="polite">Waiting for a PDF.</p>
      <span class="end">
        <span class="local">processed here, nothing uploaded</span>
        <a href="/">all tools</a>
      </span>
    </footer>

    <script type="module" src="/pdf-extractor/main.ts"></script>
  </body>
</html>
